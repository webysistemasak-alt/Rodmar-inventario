<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RODMAR Integración Médica — Inventario</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue-dark:   #0a1628;
  --blue-mid:    #0d2044;
  --blue:        #1a3a6e;
  --blue-light:  #1e4d9b;
  --blue-pale:   #e8edf7;
  --red:         #c0392b;
  --red-light:   #e74c3c;
  --red-pale:    #fdf0ef;
  --amber:       #b7770d;
  --amber-pale:  #fef9ec;
  --green:       #1a7a4a;
  --green-pale:  #edf7f2;
  --text:        #1a2332;
  --text-mid:    #4a5568;
  --text-soft:   #718096;
  --border:      #dde3ed;
  --border-soft: #edf0f5;
  --bg:          #f4f6fb;
  --white:       #ffffff;
  --radius:      8px;
  --radius-lg:   12px;
  --shadow-sm:   0 1px 3px rgba(10,22,40,.07), 0 1px 2px rgba(10,22,40,.04);
  --shadow:      0 4px 12px rgba(10,22,40,.10), 0 1px 4px rgba(10,22,40,.05);
}

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── TOPBAR ── */
.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}

.brand-text { line-height: 1.3; }
.brand-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--blue-dark);
  letter-spacing: .3px;
}
.brand-sub {
  font-size: 11px;
  color: var(--text-soft);
  font-weight: 400;
}

.topbar-right { display: flex; align-items: center; gap: 10px; }

.live-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 20px;
  background: var(--green-pale);
  border: 1px solid #b2dfc8;
  font-size: 11px;
  font-weight: 600;
  color: var(--green);
  letter-spacing: .3px;
}
.pulse {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

/* ── KPI BAND ── */
.kpi-band {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  background: var(--white);
  border-bottom: 1px solid var(--border);
}
.kpi {
  padding: 18px 24px;
  border-right: 1px solid var(--border);
  position: relative;
}
.kpi:last-child { border-right: none; }
.kpi-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: 0;
}
.kpi-val {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -1.2px;
  color: var(--text);
  line-height: 1;
  margin-bottom: 5px;
}
.kpi-val.kr { color: var(--red); }
.kpi-val.ka { color: var(--amber); }
.kpi-val.kg { color: var(--green); }
.kpi-label { font-size: 11.5px; color: var(--text-soft); font-weight: 500; }

/* ── TOOLBAR ── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 32px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.search-box {
  position: relative;
  flex: 1;
  min-width: 220px;
}
.search-box svg {
  position: absolute;
  left: 11px; top: 50%;
  transform: translateY(-50%);
  width: 14px; height: 14px;
  color: var(--text-soft);
  pointer-events: none;
}
.search-box input {
  width: 100%;
  padding: 9px 12px 9px 33px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  color: var(--text);
  background: var(--bg);
  outline: none;
  transition: border-color .15s, background .15s;
}
.search-box input::placeholder { color: var(--text-soft); }
.search-box input:focus {
  border-color: var(--blue-light);
  background: var(--white);
}

.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-mid);
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: all .15s;
}
.chip:hover { border-color: var(--blue-light); color: var(--blue-light); }
.chip.on      { background: var(--blue-dark); color: #fff; border-color: var(--blue-dark); }
.chip.on-r    { background: var(--red-pale); color: var(--red); border-color: #f5b8b4; }
.chip.on-a    { background: var(--amber-pale); color: var(--amber); border-color: #f5dfa0; }
.chip.on-g    { background: var(--green-pale); color: var(--green); border-color: #b2dfc8; }

.add-btn {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 18px;
  border-radius: var(--radius);
  background: var(--blue-dark);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  white-space: nowrap;
  transition: background .15s;
}
.add-btn:hover { background: var(--blue); }
.add-btn svg { width: 14px; height: 14px; }

/* ── SYNC ── */
.sync {
  padding: 6px 32px;
  font-size: 11px;
  color: var(--text-soft);
  background: var(--bg);
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  gap: 6px;
}
.sync-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--green);
}

/* ── GRID ── */
.main { padding: 24px 32px 48px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}

/* ── CARD ── */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s, transform .15s;
  animation: fadein .2s ease;
  position: relative;
  overflow: hidden;
}
@keyframes fadein { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
.card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }

.card-accent {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.card.sc .card-accent { background: linear-gradient(90deg, var(--red), #f08080); }
.card.sl .card-accent { background: linear-gradient(90deg, var(--amber), #f5c842); }
.card.so .card-accent { background: linear-gradient(90deg, var(--green), #4caf82); }

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 14px;
}
.card-code {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-soft);
  margin-bottom: 4px;
}
.card-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.35;
}
.card-meta {
  font-size: 11px;
  color: var(--text-soft);
  margin-top: 4px;
}

.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
}
.bc { background: var(--red-pale);   color: var(--red);   border: 1px solid #f5c0bc; }
.bl { background: var(--amber-pale); color: var(--amber); border: 1px solid #f5dfa0; }
.bo { background: var(--green-pale); color: var(--green); border: 1px solid #b2dfc8; }

/* ── QTY CONTROL ── */
.card-body { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.qty-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 12px;
}
.qbtn {
  width: 26px; height: 26px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--white);
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .12s;
  line-height: 1;
}
.qbtn:hover { background: var(--blue-dark); color: #fff; border-color: var(--blue-dark); }
.qbtn:active { transform: scale(.9); }
.qnum {
  font-size: 24px;
  font-weight: 700;
  min-width: 38px;
  text-align: center;
  color: var(--text);
  letter-spacing: -1px;
}

.bar-wrap { flex: 1; }
.bar-top {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-soft);
  margin-bottom: 6px;
  font-weight: 500;
}
.bar-track {
  height: 6px;
  background: var(--border-soft);
  border-radius: 3px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width .4s ease, background-color .3s;
}
.bar-bottom {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--text-soft);
  margin-top: 4px;
}
.bar-bottom .warn { color: var(--red); font-weight: 600; }

/* ── CARD FOOTER ── */
.card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 12px;
  border-top: 1px solid var(--border-soft);
}
.card-date { font-size: 10.5px; color: var(--text-soft); }
.del-btn {
  width: 28px; height: 28px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-soft);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.del-btn:hover {
  background: var(--red-pale);
  color: var(--red);
  border-color: #f5b8b4;
}
.del-btn svg { width: 13px; height: 13px; }

/* ── EMPTY ── */
.empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 5rem 1rem;
  color: var(--text-soft);
}
.empty svg { width: 44px; height: 44px; margin: 0 auto 12px; display: block; opacity: .25; }
.empty p { font-size: 14px; font-weight: 500; }

/* ── LOADING ── */
.loading {
  grid-column: 1/-1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 5rem;
  gap: 14px;
  color: var(--text-soft);
}
.spinner {
  width: 32px; height: 32px;
  border: 2.5px solid var(--border);
  border-top-color: var(--blue-dark);
  border-radius: 50%;
  animation: spin .75s linear infinite;
}
@keyframes spin { to{ transform: rotate(360deg); } }
.loading p { font-size: 13px; font-weight: 500; }

/* ── MODAL ── */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(10,22,40,.55);
  backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 20px;
}
.modal {
  background: var(--white);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  padding: 28px;
  width: 400px; max-width: 100%;
  box-shadow: var(--shadow);
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-soft);
}
.modal-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}
.modal-title span {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: var(--text-soft);
  margin-top: 2px;
}
.x-btn {
  width: 30px; height: 30px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-soft);
  font-size: 15px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Inter', sans-serif;
  transition: all .15s;
}
.x-btn:hover { background: var(--bg); color: var(--text); }

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-mid);
  margin-bottom: 5px;
  letter-spacing: .2px;
}
.field input {
  width: 100%;
  padding: 10px 13px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13.5px;
  font-family: 'Inter', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color .15s;
}
.field input::placeholder { color: var(--text-soft); }
.field input:focus { border-color: var(--blue-light); }
.field-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.err {
  font-size: 11px;
  font-weight: 600;
  color: var(--red);
  margin-top: 5px;
  display: none;
}
.modal-foot {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px solid var(--border-soft);
}
.btn-cancel {
  padding: 9px 18px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: transparent;
  color: var(--text-mid);
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: all .15s;
}
.btn-cancel:hover { border-color: var(--text-mid); color: var(--text); }
.btn-save {
  padding: 9px 22px;
  font-size: 13px;
  font-weight: 600;
  border: none;
  border-radius: var(--radius);
  background: var(--blue-dark);
  color: #fff;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: background .15s;
}
.btn-save:hover { background: var(--blue); }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--text);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  padding: 11px 22px;
  border-radius: 20px;
  z-index: 300;
  opacity: 0;
  pointer-events: none;
  font-family: 'Inter', sans-serif;
  transition: all .25s;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── RESPONSIVE ── */
@media (max-width: 680px) {
  .topbar { padding: 0 16px; }
  .kpi-band { grid-template-columns: repeat(2,1fr); }
  .toolbar { padding: 12px 16px; }
  .sync { padding: 6px 16px; }
  .main { padding: 16px 16px 40px; }
  .add-btn .btn-label { display: none; }
}
</style>
</head>
